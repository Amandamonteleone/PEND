<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Alimente o Gatinho</h1>

    <p>Arraste a comida até o gatinho!</p>

    <div class="jogo">

        <div class="comidas">

            <div class="comida" draggable="true" id="batata">🍟</div>

            <div class="comida" draggable="true" id="frango">🍗</div>

            <div class="comida" draggable="true" id="chocolate">🍫</div>

            <div class="comida" draggable="true" id="peixe">🐟</div>

            <div class="comida" draggable="true" id="leite">🥛</div>

            <div class="comida" draggable="true" id="carne">🍖</div>

        </div>


        <div id="gatinho" class="gatinho">

            <div class="gato-area">

                <img src="img/cat.png" alt="Gatinho" id="imagemGato">

            </div>

        </div>

    </div>

    <p id="mensagem"></p>

    <button id="finalizar">Finalizar</button>


    <script src="script.js"></script>

</body>

</html>
